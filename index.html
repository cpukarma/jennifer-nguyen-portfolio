<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jennifer Nguyen's Portfolio</title>
<meta name="description" content="Portfolio of Jennifer Nguyen: UI/UX case studies, leadership, illustration and design.">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: dark;
    --space: #29233d;
    --space-raised: #342d4c;
    --lavender: #dacbf5;
    --lavender-muted: #b3a7d1;
    --gold: #f4b550;
    --hairline: #4a4266;
    --on-fill: #29233d;
    --radius-sm: 10px;
    --radius-lg: 24px;
    --font: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    --nav-h: 112px;
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--space); color: var(--lavender);
    font-family: var(--font); font-size: 17px; line-height: 1.65;
    overflow: hidden; -webkit-font-smoothing: antialiased;
  }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #bigmoon { position: fixed; top: 7vh; right: 6vw; width: min(34vw, 340px); height: auto; opacity: .2; pointer-events: none; will-change: transform; }
  .app { position: relative; height: 100%; display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: minmax(0, 1fr); }

  /* top bar */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px clamp(16px, 4vw, 48px) 0; position: relative; z-index: 2; }
  .mark { font-weight: 600; letter-spacing: -.01em; font-size: 18px; color: var(--lavender); text-decoration: none; background: none; border: 0; padding: 0; font-family: inherit; cursor: pointer; }
  .mark { display: inline-flex; align-items: center; gap: 10px; }
  .logo { width: 32px; height: 32px; flex: none; transition: transform .4s ease; }
  .mark:hover .logo { transform: translate(3px, -3px); }

  /* stage + panels */
  .stage { position: relative; overflow: hidden; z-index: 1; }
  .track { display: flex; height: 100%; will-change: transform; }
  .panel { flex: 0 0 100%; height: 100%; overflow-y: auto; overflow-x: hidden; box-sizing: border-box; padding-block: clamp(24px, 6vh, 64px) 32px; padding-inline: clamp(16px, 4vw, 48px); }
  .inner { max-width: 1040px; margin: 0 auto; display: grid; gap: 24px; }
  .panel[aria-hidden="true"] { visibility: hidden; }
  .panel.near { visibility: visible; }

  .eyebrow { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); font-weight: 600; margin: 0; }
  h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; }
  h1 { font-size: clamp(32px, 4vw, 44px); line-height: 1.1; letter-spacing: -.02em; }
  h2 { font-size: clamp(32px, 5vw, 48px); line-height: 1.1; letter-spacing: -.02em; }
  h3 { font-size: 22px; line-height: 1.35; font-weight: 500; }
  p { margin: 0; max-width: 62ch; }
  .lede { font-size: clamp(18px, 2vw, 21px); line-height: 1.55; }
  .muted { color: var(--lavender-muted); }
  .small { font-size: 14px; line-height: 20px; }

  /* buttons: leaf shape from Figma */
  .actions { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 8px; }
  .btn { font: 500 17px/1 var(--font); padding: 15px 30px; cursor: pointer; border-radius: var(--radius-lg) var(--radius-lg) var(--radius-sm) var(--radius-lg); border: 1.5px solid var(--lavender); transition: transform .2s ease; }
  .btn:hover { transform: translateY(-2px); }
  .btn.fill { background: var(--lavender); color: var(--on-fill); }
  .btn.line { background: transparent; color: var(--lavender); }

  /* link with badge */
  .link { display: inline-flex; align-items: center; gap: 12px; color: var(--lavender); text-decoration: none; font-size: 18px; }
  .badge { width: 36px; height: 36px; border-radius: 999px; display: grid; place-items: center; flex: none; transition: transform .2s ease; }
  .badge.l { background: var(--lavender); } .badge.g { background: var(--gold); }
  .badge svg { width: 16px; height: 16px; stroke: var(--on-fill); }
  .link:hover .badge { transform: rotate(45deg); }

  /* chips */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { font-size: 14px; font-weight: 600; line-height: 1; padding: 8px 12px; border-radius: var(--radius-sm); background: var(--lavender); color: var(--on-fill); }
  .chip.g { background: var(--gold); }

  /* cards */
  .grid { display: grid; gap: 24px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
  .card { background: var(--space-raised); border-radius: var(--radius-lg); padding: 24px; display: grid; gap: 12px; align-content: start; }
  .card.feature { grid-column: 1 / -1; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 24px; align-items: center; }
  .card.empty { background: transparent; border: 1.5px dashed var(--hairline); }
  .card.empty h3 { color: var(--lavender-muted); }
  .thumb { aspect-ratio: 4 / 3; max-width: 100%; border-radius: var(--radius-sm); background: var(--space); position: relative; overflow: hidden; }
  .thumb canvas { width: 100%; height: 100%; display: block; }
  .tag { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--lavender-muted); font-weight: 600; }

  /* illustration masonry */
  .masonry { columns: 3 220px; column-gap: 8px; }
  .art { break-inside: avoid; margin: 0 0 8px; width: 100%; border: 0; padding: 0; border-radius: var(--radius-sm); background: var(--space-raised); display: block; position: relative; overflow: hidden; cursor: pointer; font: inherit; color: var(--lavender); text-align: left; }
  .art img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s ease; }
  .art .art-ph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--lavender-muted); font-size: 13px; }
  .art .art-cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 32px 12px 12px; background: linear-gradient(to top, rgba(41, 35, 61, .92), rgba(41, 35, 61, 0)); display: flex; justify-content: space-between; align-items: end; gap: 8px; font-size: 14px; font-weight: 500; opacity: 0; transform: translateY(6px); transition: opacity .25s, transform .25s; }
  .art .art-cap span:last-child { font-size: 12px; color: var(--lavender-muted); white-space: nowrap; }
  .art:hover .art-cap, .art:focus-visible .art-cap { opacity: 1; transform: none; }
  .art:hover img { transform: scale(1.03); }
  @media (hover: none) { .art .art-cap { opacity: 1; transform: none; } }
  #lightbox { border: 0; padding: 0; background: var(--space-raised); color: var(--lavender); border-radius: var(--radius-lg); width: min(1040px, calc(100vw - 32px)); max-height: calc(100vh - 32px); box-shadow: 0 24px 64px rgba(0, 0, 0, .5); }
  #lightbox::backdrop { background: rgba(20, 16, 32, .82); }
  .lb { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); max-height: calc(100vh - 32px); }
  .lb-media { background: var(--space); display: grid; place-items: center; min-height: 320px; }
  .lb-media img { max-width: 100%; max-height: calc(100vh - 32px); object-fit: contain; display: block; }
  .lb-media .art-ph { color: var(--lavender-muted); font-size: 14px; padding: 48px; text-align: center; }
  .lb-info { padding: 32px 28px; display: grid; align-content: start; gap: 14px; overflow-y: auto; }
  .lb-info h3 { font-size: 28px; line-height: 36px; font-weight: 600; }
  .lb-info p { color: var(--lavender); font-size: 16px; line-height: 26px; }
  .lb-sec { display: grid; gap: 8px; }
  .lb-sec h4 { margin: 0; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--lavender-muted); font-weight: 600; }
  .lb-process { display: grid; gap: 12px; border-top: 1px solid var(--hairline); padding-top: 16px; }
  .lb-process h4 { margin: 0; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--lavender-muted); font-weight: 600; }
  .lb-steps { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px; }
  .lb-step { border: 1.5px solid transparent; background: var(--space); border-radius: var(--radius-sm); padding: 0; cursor: pointer; color: var(--lavender-muted); font: 500 11px/1.2 var(--font); display: grid; overflow: hidden; }
  .lb-step .lb-thumb { aspect-ratio: 1; display: grid; place-items: center; background: var(--space); overflow: hidden; }
  .lb-step .lb-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .lb-step .lb-cap { padding: 6px 4px; text-align: center; background: var(--space-raised); }
  .lb-step[aria-pressed="true"] { border-color: var(--lavender); color: var(--lavender); }
  .lb-notes { font-size: 15px !important; line-height: 24px !important; color: var(--lavender-muted) !important; }
  .lb-close { position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; border-radius: 999px; border: 0; background: var(--space); color: var(--lavender); font-size: 22px; line-height: 1; cursor: pointer; }
  .lb-nav { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
  .lb-nav button { background: none; border: 1.5px solid var(--lavender); color: var(--lavender); border-radius: var(--radius-sm); padding: 8px 14px; font: 500 14px/1 var(--font); cursor: pointer; }
  .lb-count { font-size: 13px; color: var(--lavender-muted); font-variant-numeric: tabular-nums; }
  @media (max-width: 760px) { .lb { grid-template-columns: 1fr; overflow-y: auto; } .lb-media { min-height: 220px; } .lb-media img { max-height: 55vh; } .lb-info { padding: 20px; } }

  /* about */
  .facts { display: grid; gap: 0; margin: 0; }
  .facts div { display: grid; grid-template-columns: 140px 1fr; gap: 16px; padding: 12px 0; border-top: 1px solid var(--hairline); }
  .facts dt { color: var(--lavender-muted); font-size: 14px; }
  .facts dd { margin: 0; }
  .copy { font: 500 14px/1 var(--font); background: none; border: 1.5px solid var(--lavender); color: var(--lavender); border-radius: var(--radius-sm); padding: 8px 12px; cursor: pointer; margin-left: 8px; }
  .two { display: grid; gap: 48px; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); align-items: start; }

  /* lunar nav */
  .orbit { position: relative; z-index: 2; padding: 88px clamp(8px, 3vw, 48px) calc(16px + env(safe-area-inset-bottom, 0px)); }
  .orbit svg.arc { position: absolute; left: 0; right: 0; bottom: 70px; width: 100%; height: 120px; pointer-events: none; }
  .orbit ol { list-style: none; margin: 0 auto; padding: 0; max-width: 1040px; display: flex; justify-content: space-between; align-items: flex-end; position: relative; }
  .phase { background: none; border: 0; padding: 8px 6px; color: var(--lavender); font: 500 17px/1.25 var(--font); cursor: pointer; display: grid; justify-items: center; gap: 10px; border-radius: var(--radius-sm); min-width: 88px; transition: color .3s; }
  .phase .moon-img { width: 104px; height: 104px; display: block; transition: transform .4s cubic-bezier(.3,1.4,.5,1), filter .4s; }
  .phase:hover .moon-img { transform: translateY(-4px) scale(1.08); }
  .phase[aria-current="true"] { color: var(--gold); }
  .phase[aria-current="true"] .moon-img { transform: translateY(-10px) scale(1.15); filter: drop-shadow(0 0 12px rgba(244, 181, 80, .6)); }
  .phase .pn { font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--lavender-muted); display: block; margin-top: 2px; font-weight: 400; }
  .phase[aria-current="true"] .pn { color: var(--gold); }
  .hint { text-align: center; font-size: 13px; color: var(--lavender-muted); margin: 0 0 6px; }

  #kitty { position: fixed; left: 0; top: 0; width: 96px; height: auto; z-index: 3; pointer-events: none; will-change: transform; filter: drop-shadow(0 8px 14px rgba(0, 0, 0, .3)); }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }
  @media (max-width: 760px) { #kitty { width: 60px; } .orbit { padding-top: 56px; } .app.at-home .phase .moon-img { width: 13vw; height: 13vw; } .app.at-home .phase { font-size: 14px; } .app.at-home .orbit { padding-top: 76px; } }
  @media (max-width: 420px) { #kitty { width: 50px; } .orbit { padding-top: 48px; } .app.at-home .phase .moon-img { width: 54px; height: 54px; } .app.at-home .phase { font-size: 11px; } .app.at-home .orbit { padding-top: 60px; } }
  .home-inner { height: 100%; align-content: end; justify-items: center; text-align: center; gap: 12px; padding-bottom: clamp(16px, 5vh, 56px); }
  .home-inner h1 { font-size: clamp(30px, 4.2vw, 52px); }
  .home-hint { font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--lavender-muted); }
  .phase .moon-img { transition: transform .4s cubic-bezier(.3,1.4,.5,1), filter .4s, width .6s ease, height .6s ease; }
  @media (min-width: 761px) {
    .app.at-home .phase .moon-img { width: min(156px, 13vw); height: min(156px, 13vw); }
    .app.at-home .orbit { padding-top: 110px; }
    .app.at-home .phase { font-size: 20px; }
  }
  .app.at-home .orbit { padding-bottom: max(24px, calc(50vh - 150px)); }
  .orbit svg.arc { transition: bottom .6s ease; }
  .app.at-home .orbit svg.arc { bottom: calc(max(24px, calc(50vh - 150px)) + 40px); }
  @media (max-width: 760px) { .app.at-home .orbit { padding-bottom: max(24px, calc(50vh - 90px)); } .app.at-home .orbit svg.arc { bottom: calc(max(24px, calc(50vh - 90px)) + 30px); } }
  .orbit { transition: padding .6s ease; }
  [hidden] { display: none !important; }
  /* case study pages */
  .lead-hero { width: 100%; max-width: 320px; aspect-ratio: 4 / 3; font-size: 13px; }
  .linkbtn { background: none; border: 0; padding: 0; font: inherit; font-size: 18px; cursor: pointer; justify-self: start; }
  .back { justify-self: start; background: none; border: 1.5px solid var(--lavender); color: var(--lavender); font: 500 15px/1 var(--font); padding: 10px 16px; border-radius: var(--radius-sm); cursor: pointer; }
  .back:hover { background: var(--space-raised); }
  .cs-detail { gap: 32px; }
  .cs-head { display: grid; gap: 12px; }
  .cs-hero { aspect-ratio: 16 / 7; }
  .cs-meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 16px; margin: 0; }
  .cs-meta div { border-top: 1px solid var(--hairline); padding-top: 12px; display: grid; gap: 4px; }
  .cs-meta dt { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--lavender-muted); font-weight: 600; }
  .cs-meta dd { margin: 0; }
  .fill-in { color: var(--lavender-muted); font-style: italic; }
  .cs-body { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 48px; align-items: start; }
  .cs-toc { position: sticky; top: 0; display: grid; gap: 4px; }
  .cs-toc a { color: var(--lavender-muted); text-decoration: none; padding: 6px 12px; border-radius: var(--radius-sm); font-size: 15px; }
  .cs-toc a:hover, .cs-toc a.on { color: var(--lavender); background: var(--space-raised); }
  .cs-sections { display: grid; gap: 48px; }
  .cs-sec { display: grid; gap: 16px; scroll-margin-top: 16px; }
  .cs-sec h3 { font-size: 28px; line-height: 36px; font-weight: 600; }
  .cs-sec h4 { margin: 0; font-size: 18px; font-weight: 600; }
  .todo { border: 1.5px dashed var(--hairline); border-radius: var(--radius-sm); padding: 12px 16px; display: grid; gap: 6px; }
  .todo p { color: var(--lavender-muted); font-size: 15px; line-height: 24px; }
  .todo-tag { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
  .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 24px; }
  .steps li { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 16px; }
  .steps li > div { display: grid; gap: 8px; }
  .step-n { width: 40px; height: 40px; border-radius: 999px; background: var(--gold); color: var(--on-fill); font-weight: 600; display: grid; place-items: center; }
  .frames { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 16px; }
  .frame { margin: 0; display: grid; gap: 8px; }
  .frame-slot { aspect-ratio: 16 / 10; border-radius: var(--radius-sm); background: var(--space-raised); display: grid; place-items: center; color: var(--lavender-muted); font-size: 14px; }
  .frame figcaption { font-size: 14px; color: var(--lavender-muted); }
  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); gap: 16px; }
  .metric { background: var(--space-raised); border-radius: var(--radius-lg); padding: 20px; display: grid; gap: 4px; }
  .m-val { font-size: 36px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .m-lbl { font-size: 14px; color: var(--lavender-muted); }
  @media (max-width: 760px) { .cs-body { grid-template-columns: 1fr; gap: 24px; } .cs-toc { position: static; display: flex; flex-wrap: wrap; } }
  .about-side { display: grid; gap: 24px; align-content: start; }
  .resume { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 16px; padding: 20px; border-radius: var(--radius-lg); background: var(--space-raised); color: var(--lavender); text-decoration: none; transition: transform .2s ease; }
  .resume:hover { transform: translateY(-2px); }
  .resume:hover .badge { transform: rotate(45deg); }
  .resume-doc { width: 48px; height: 60px; border-radius: 6px; background: var(--lavender); display: grid; align-content: center; gap: 6px; padding: 0 10px; box-sizing: border-box; }
  .resume-doc span { height: 3px; border-radius: 2px; background: var(--space); opacity: .55; }
  .resume-doc span:nth-child(1) { width: 70%; opacity: .9; }
  .resume-text { display: grid; gap: 2px; }
  .resume-title { font-size: 20px; font-weight: 600; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb-empty { border: 1.5px dashed var(--hairline); background: transparent; display: grid; place-items: center; color: var(--lavender-muted); font-size: 14px; box-sizing: border-box; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  @media (max-width: 760px) {
    .card.feature, .two { grid-template-columns: 1fr; }
    .facts div { grid-template-columns: 1fr; gap: 2px; }
    .phase { min-width: 52px; font-size: 14px; padding-inline: 2px; }
    .phase .moon-img { width: 64px; height: 64px; }
    .orbit svg.arc { bottom: 40px; height: 70px; }
    .phase .pn { display: none; }
    #bigmoon { width: 46vw; opacity: .12; }
  }
  @media (max-width: 420px) {
    .phase { min-width: 0; font-size: 11px; align-content: start; }
    .orbit ol { align-items: flex-start; }
    .phase .moon-img { width: 52px; height: 52px; }
    .orbit { padding-inline: 8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .btn, .badge, .phase .moon-img { transition: none; }
  }

  /* ---------- content helpers ---------- */
  .prose { display: grid; gap: 12px; }
  .page-links { display: flex; flex-wrap: wrap; gap: 16px; }
  .soon { color: var(--lavender-muted); font-size: 15px; }
  .card { position: relative; }
  .about-photo { width: 100%; max-width: 240px; aspect-ratio: 4 / 5; border-radius: var(--radius-lg); overflow: hidden; background: var(--space-raised); }
  .about-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb.fit img { object-fit: contain; }
  .art { min-height: 120px; }
  .lb-links { display: flex; flex-wrap: wrap; gap: 12px; }
  .lb-links a { color: var(--lavender); font-size: 15px; }

  /* ---------- edit mode (hidden from visitors) ---------- */
  .edit-only { display: none !important; }
  body.editing .edit-only { display: revert !important; }
  body.editing .ctl.edit-only, body.editing .edit-row.edit-only { display: flex !important; }
  body.editing .add-card.edit-only, body.editing .thumb-empty.edit-only, body.editing .cs-sec.edit-only { display: grid !important; }

  .edit-bar { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); z-index: 30; display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 16px; border-radius: 999px; background: var(--lavender); color: var(--on-fill); font: 600 14px/1 var(--font); box-shadow: 0 8px 24px rgba(0,0,0,.35); max-width: calc(100vw - 32px); flex-wrap: wrap; }
  .edit-bar .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--on-fill); }
  .edit-bar button { font: 600 13px/1 var(--font); border: 0; border-radius: 999px; padding: 9px 14px; cursor: pointer; background: var(--on-fill); color: var(--lavender); }
  .edit-bar .mode { font-weight: 500; opacity: .8; }

  .ctl { position: absolute; top: 10px; right: 10px; z-index: 2; gap: 6px; }
  .ctl button, .edit-btn { font: 600 12px/1 var(--font); padding: 8px 10px; border-radius: 999px; border: 1.5px solid var(--lavender); background: var(--space); color: var(--lavender); cursor: pointer; }
  .ctl button.danger { border-color: var(--gold); color: var(--gold); }
  .ctl button:disabled { opacity: .35; cursor: default; }
  .edit-row { gap: 8px; flex-wrap: wrap; align-items: center; }
  .add-card { place-items: center; min-height: 160px; border: 1.5px dashed var(--lavender-muted); border-radius: var(--radius-lg); background: transparent; color: var(--lavender); font: 600 16px/1.3 var(--font); cursor: pointer; padding: 24px; }
  .add-card:hover { background: var(--space-raised); }
  .masonry .add-card { width: 100%; margin-bottom: 8px; min-height: 140px; break-inside: avoid; border-radius: var(--radius-sm); }
  .empty-hint { border: 1.5px dashed var(--hairline); border-radius: var(--radius-sm); padding: 12px 16px; color: var(--lavender-muted); font-size: 14px; }

  /* editor dialog */

  // ---------- Small helpers ----------
  const clone = o => JSON.parse(JSON.stringify(o));

    const el = document.createElement(tag);

      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "html") el.innerHTML = v; // only ever used with our own static markup
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
    return el;
  }
  const filled = v => typeof v === "string" ? v.trim().length > 0 : Array.isArray(v) ? v.length > 0 : !!v;
  function safeUrl(u, forImage) {
    u = String(u || "").trim();
    if (!u) return "";
    if (/^(https?:|mailto:)/i.test(u)) return u;
    if (forImage && /^(data:image\/|blob:)/i.test(u)) return u;
    if (/^data:application\/pdf/i.test(u)) return u; // preview-mode resume
    if (/^[\w./-]+$/.test(u) && !u.startsWith("//")) return u; // relative file in the repo
    return "";
  }
  function paragraphs(text, cls) {

  function mergeDefaults(data) {
    const out = clone(DEFAULT_CONTENT);

  }

  async function loadContent() {
    try {
      const r = await fetch("/api/content", { cache: "no-store" });

  async function shrinkImage(file) {
    if (!/^image\/(png|jpeg|webp)$/.test(file.type)) return file;
    try {
      const bmp = await createImageBitmap(file);
      const scale = Math.min(1, 2400 / Math.max(bmp.width, bmp.height));
      const c = document.createElement("canvas"); c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
      c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
      const out = await new Promise(r => c.toBlob(r, "image/webp", 0.9));
      if (out && (out.size < file.size || scale < 1)) return new File([out], file.name.replace(/\.\w+$/, "") + ".webp", { type: "image/webp" });
    } catch (e) {}
    return file;
  }
  async function uploadFile(file) {
    const f = file.type.startsWith("image/") ? await shrinkImage(file) : file;

    if (r.status === 401) { lockEditing(); throw new Error("Your password didn't work. Unlock edit mode again."); }
    if (!r.ok) throw new Error(j.error || "Upload failed");
    return j.url;

  function anchor(i) {
    const m = document.querySelectorAll(".phase .moon-img")[i]; if (!m) return { x: 0, y: 0 };
    const r = m.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height * 0.22 };
  }
  function flyTo(i) {
    if (K.x == null) { K.at = i; return; }
    if (i === K.at && !K.flying) return;
    if (reduce) { K.at = i; K.flying = false; return; }
    K.from = { x: K.x, y: K.y }; K.to = i; K.t0 = performance.now();
    K.dur = Math.min(2600, 1300 + 260 * Math.abs(i - (K.flying ? K.to : K.at)));
    K.face = anchor(i).x >= K.x ? 1 : -1; K.flying = true;
  }
  const ease = p => 0.5 - Math.cos(p * Math.PI) / 2;
  function kittyFrame(t) {
    const s = t / 1000, kw = kitty.offsetWidth, kh = kitty.offsetHeight;
    let x, y, rot = 0;
    if (K.flying) {
      const p = Math.min(1, (t - K.t0) / K.dur), e = ease(p), A = K.from, B = anchor(K.to);
      x = A.x + (B.x - A.x) * e;
      y = A.y + (B.y - A.y) * e - Math.sin(p * Math.PI) * 14 + Math.sin(p * Math.PI * 4) * 5 * Math.sin(p * Math.PI);
      rot = K.face * 8 * Math.sin(p * Math.PI) + Math.sin(p * Math.PI * 3) * 5;
      if (t - K.lastEmit > 40) { K.lastEmit = t; dust.push({ x: x - K.face * kw * 0.3, y: y - kh * 0.35 + (Math.random() - .5) * 18, r: 1.5 + Math.random() * 3, life: 1, vx: -K.face * Math.random() * .3, vy: -.15 - Math.random() * .35 }); }
      if (p >= 1) { K.flying = false; K.at = K.to; }
    } else {
      const a = anchor(K.at); x = a.x; y = a.y + (reduce ? 0 : Math.sin(s * 2) * 5); rot = reduce ? 0 : Math.sin(s * 1.3) * 5;
    }
    K.x = x; K.y = y;
    kitty.style.transform = `translate3d(${x - kw / 2}px, ${y - kh * 0.9}px, 0) rotate(${rot}deg) scaleX(${K.face})`;
    fctx.clearRect(0, 0, innerWidth, innerHeight);
    dust = dust.filter(d => {
      d.x += d.vx; d.y += d.vy; d.life -= 0.016;
      const R = d.r * (0.6 + d.life * 0.6), c = R * 0.18;
      fctx.globalAlpha = Math.max(0, d.life) * 0.9; fctx.fillStyle = C.lav;
      fctx.beginPath(); fctx.moveTo(d.x, d.y - R);
      fctx.quadraticCurveTo(d.x + c, d.y - c, d.x + R, d.y); fctx.quadraticCurveTo(d.x + c, d.y + c, d.x, d.y + R);
      fctx.quadraticCurveTo(d.x - c, d.y + c, d.x - R, d.y); fctx.quadraticCurveTo(d.x - c, d.y - c, d.x, d.y - R); fctx.fill();
      return d.life > 0;
    });
    fctx.globalAlpha = 1;
  }

  // ---------- Start ----------
  (async () => {
    CONTENT = await loadContent();
    renderAll();
    // deep links: #section or #page-id
    const hash = decodeURIComponent(location.hash.slice(1));
    let idx = SECTIONS.findIndex(s => s.id === hash);
    const page = hash && document.getElementById(hash);
    if (page && page.classList.contains("cs-detail")) { idx = panels.indexOf(page.closest(".panel")); showDetail(hash); }
    if (idx > 0) { target = cam = idx; K.at = idx; current = -1; setCurrent(idx); }
    try { const pw = sessionStorage.getItem("lunar-pw"); if (pw != null && mode === "live") { password = pw; startEditing(); } } catch (e) {}
    requestAnimationFrame(frame);
  })();
})();

</script>
